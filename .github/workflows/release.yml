# SPDX-License-Identifier: MIT

# on a tag such as v0.2.0: test, package, sign for firefox, publish a github release
# actions are pinned by commit, since these jobs hold secrets

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package, refusing a tag that differs from the manifest's version
        run: node scripts/package.mjs "${GITHUB_REF_NAME#v}"
      # unlisted: mozilla signs it without a store listing, and the .xpi installs from anywhere
      - name: Sign for Firefox
        if: env.AMO_JWT_ISSUER != ''
        run: >
          pnpm exec web-ext sign --source-dir dist/firefox --artifacts-dir dist --channel unlisted
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - name: Note the missing Firefox signature
        if: env.AMO_JWT_ISSUER == ''
        run: echo "::notice::AMO_JWT_ISSUER is not set; the release has no signed Firefox package."
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # without the firefox signature there is no .xpi to attach
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/*.zip dist/*.xpi client/client.js client/client.d.ts

